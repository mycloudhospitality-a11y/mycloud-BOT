name: Zoho Desk Cloud Sync

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  build-and-sync:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration Release --no-restore

    - name: Run Zoho Sync Bot
      run: dotnet run --project ZohoSqlBot.vbproj --configuration Release --no-restore
      env:
        TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}