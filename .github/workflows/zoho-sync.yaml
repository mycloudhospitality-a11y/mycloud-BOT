name: Zoho Desk Cloud Sync

on:
  schedule:
    - cron: '*/30 * * * *' # Runs automatically every 30 minutes
  workflow_dispatch: # Allows manual trigger anytime

# Prevents overlapping runs if execution takes longer than 30 minutes
concurrency:
  group: zoho-sync-group
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: windows-latest
    timeout-minutes: 20 # Automatically terminates frozen runs

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration Release --no-restore

    - name: Run Zoho Sync Bot
      run: dotnet run --project ZohoSqlBot.vbproj --configuration Release --no-restore
      env:
        TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

    - name: Send Report Email on Success
      if: success()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: "mycloudhospitality@gmail.com"
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "Zoho Desk Sync & Executive Dashboard Report"
        to: deepak@mycloudhospitality.com
        cc: SHANTANU@mycloudhospitality.com
        from: "Zoho Bot <no-reply@mycloudhospitality.com>"
        body: "The Zoho Desk sync completed successfully. Attached is the executive Excel report."
        attachments: "Executive_CEO_Dashboard.xlsx"

    - name: Send Error Alert on Failure
      if: failure()
      uses: dawidd6/action-send-mail@v3
      with:
        server_address: smtp.gmail.com
        server_port: 465
        secure: true
        username: "mycloudhospitality@gmail.com"
        password: ${{ secrets.EMAIL_PASSWORD }}
        subject: "⚠️ ALERT: Zoho Desk Sync Failed"
        to: SHANTANU@mycloudhospitality.com
        from: "Zoho Bot Alerts <SHANTANU@mycloudhospitality.com>"
        body: "The automated Zoho Desk sync encountered an error during execution. Please check the GitHub Actions logs."